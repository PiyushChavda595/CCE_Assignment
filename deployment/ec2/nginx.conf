# Nginx configuration for CampusCare on Amazon EC2
# Place in: /etc/nginx/sites-available/campuscare
# Symlink to: /etc/nginx/sites-enabled/campuscare

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Root directory for CampusCare static frontend files
    root /var/www/campuscare/frontend;
    index index.html;

    # Gzip Compression for maximum performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA / fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
